<svg xmlns="http://www.w3.org/2000/svg"
     width="200"
     height="200"
     viewBox="0 0 200 200">

  <!-- Rounded square -->
  <rect
    x="10"
    y="10"
    width="180"
    height="180"
    rx="30"
    fill="#243251"
  />

  <!-- Center text -->
  <text
    x="100"
    y="110"
